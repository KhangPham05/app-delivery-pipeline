<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e8b57"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7d3c98"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="700" fill="#ffffff"/>

  <!-- Client (your Mac) -->
  <g>
    <rect x="20" y="60" width="90" height="60" rx="6" fill="#f2f2f2" stroke="#888"/>
    <rect x="32" y="70" width="66" height="40" rx="2" fill="#fff" stroke="#aaa"/>
    <rect x="45" y="122" width="40" height="6" rx="2" fill="#bbb"/>
    <text x="65" y="150" font-size="13" text-anchor="middle" fill="#333">Your Mac</text>
  </g>
  <line x1="112" y1="90" x2="185" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="148" y="80" font-size="11" text-anchor="middle" fill="#333">kubectl</text>
  <text x="148" y="105" font-size="11" text-anchor="middle" fill="#333">port-forward</text>

  <!-- Cluster boundary -->
  <rect x="190" y="20" width="960" height="640" rx="10" fill="none" stroke="#4a5aab" stroke-width="2"/>
  <text x="215" y="45" font-size="15" font-weight="bold" fill="#2c3e78">Kubernetes Cluster (docker-desktop)</text>

  <!-- default namespace -->
  <rect x="215" y="65" width="330" height="560" rx="8" fill="none" stroke="#b03a9e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="640" font-size="13" text-anchor="middle" fill="#b03a9e">default namespace</text>

  <!-- app service -->
  <rect x="250" y="100" width="260" height="90" rx="6" fill="#fff" stroke="#e0932e" stroke-width="2"/>
  <circle cx="280" cy="130" r="14" fill="#326ce5"/>
  <text x="280" y="134" font-size="13" text-anchor="middle" fill="#fff">A</text>
  <text x="380" y="125" font-size="14" text-anchor="middle" fill="#222">app (Deployment)</text>
  <text x="380" y="145" font-size="11" text-anchor="middle" fill="#666">FastAPI - /healthz /readyz</text>
  <rect x="330" y="158" width="150" height="22" rx="4" fill="#fdebd0" stroke="#e0932e"/>
  <text x="405" y="173" font-size="11" text-anchor="middle" fill="#7e5109">exposes /metrics</text>

  <!-- postgres -->
  <rect x="250" y="230" width="260" height="90" rx="6" fill="#fff" stroke="#e0932e" stroke-width="2"/>
  <ellipse cx="280" cy="260" rx="14" ry="8" fill="#336791"/>
  <rect x="266" y="260" width="28" height="14" fill="#336791"/>
  <ellipse cx="280" cy="274" rx="14" ry="8" fill="#336791"/>
  <text x="380" y="255" font-size="14" text-anchor="middle" fill="#222">postgres-0 (StatefulSet)</text>
  <text x="380" y="275" font-size="11" text-anchor="middle" fill="#666">stable identity + storage</text>
  <rect x="330" y="288" width="150" height="22" rx="4" fill="#eaf2fb" stroke="#336791"/>
  <text x="405" y="303" font-size="11" text-anchor="middle" fill="#1a4971">data-postgres-0 (PVC)</text>

  <line x1="380" y1="190" x2="380" y2="228" stroke="#333" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="470" y="212" font-size="11" text-anchor="middle" fill="#333">DATABASE_URL</text>

  <!-- ServiceMonitor note -->
  <rect x="250" y="470" width="260" height="60" rx="6" fill="#fdf6e3" stroke="#b7950b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="380" y="495" font-size="12" text-anchor="middle" fill="#7d6608">ServiceMonitor (CRD)</text>
  <text x="380" y="513" font-size="10" text-anchor="middle" fill="#7d6608">tells Prometheus where to scrape</text>

  <!-- monitoring namespace -->
  <rect x="580" y="65" width="550" height="560" rx="8" fill="none" stroke="#b03a9e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="855" y="640" font-size="13" text-anchor="middle" fill="#b03a9e">monitoring namespace</text>

  <!-- Prometheus -->
  <rect x="610" y="100" width="230" height="90" rx="6" fill="#fff" stroke="#e0932e" stroke-width="2"/>
  <circle cx="640" cy="130" r="14" fill="#e6522c"/>
  <path d="M636,136 Q633,126 640,120 Q647,126 644,136 Q642,132 640,133 Q638,132 636,136 Z" fill="#fff"/>
  <text x="740" y="125" font-size="14" text-anchor="middle" fill="#222">Prometheus</text>
  <text x="740" y="145" font-size="11" text-anchor="middle" fill="#666">scrapes + evaluates rules</text>
  <rect x="670" y="158" width="140" height="22" rx="4" fill="#fdebd0" stroke="#e0932e"/>
  <text x="740" y="173" font-size="11" text-anchor="middle" fill="#7e5109">PrometheusRule (CRD)</text>

  <!-- Grafana -->
  <rect x="610" y="250" width="230" height="80" rx="6" fill="#fff" stroke="#e0932e" stroke-width="2"/>
  <circle cx="640" cy="280" r="14" fill="#f46800"/>
  <circle cx="640" cy="280" r="7" fill="#fff"/>
  <circle cx="640" cy="280" r="3" fill="#f46800"/>
  <text x="740" y="278" font-size="14" text-anchor="middle" fill="#222">Grafana</text>
  <text x="740" y="298" font-size="11" text-anchor="middle" fill="#666">dashboard as code (ConfigMap)</text>

  <!-- Alertmanager -->
  <rect x="610" y="400" width="230" height="80" rx="6" fill="#fff" stroke="#e0932e" stroke-width="2"/>
  <circle cx="640" cy="430" r="14" fill="#c0392b"/>
  <path d="M640,422 a7,7 0 0 1 7,7 v4 l3,4 h-20 l3,-4 v-4 a7,7 0 0 1 7,-7 z" fill="#fff"/>
  <text x="740" y="428" font-size="14" text-anchor="middle" fill="#222">Alertmanager</text>
  <text x="740" y="448" font-size="11" text-anchor="middle" fill="#666">AppDown, PodRestartingFrequently</text>

  <!-- kube-state-metrics -->
  <rect x="610" y="530" width="230" height="60" rx="6" fill="#fff" stroke="#e0932e" stroke-width="2"/>
  <text x="740" y="555" font-size="13" text-anchor="middle" fill="#222">kube-state-metrics</text>
  <text x="740" y="573" font-size="10" text-anchor="middle" fill="#666">Pod/Deployment status</text>

  <!-- arrows within monitoring -->
  <line x1="740" y1="330" x2="740" y2="398" stroke="#333" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="800" y="368" font-size="11" text-anchor="middle" fill="#333">fires alerts</text>
  <line x1="720" y1="250" x2="695" y2="192" stroke="#333" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="655" y="222" font-size="11" text-anchor="middle" fill="#333">query data</text>
  <path d="M610,560 L595,560 L595,145 L608,145" stroke="#2e8b57" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="565" y="355" font-size="11" text-anchor="middle" fill="#2e8b57" transform="rotate(-90 565 355)">scraped by Prometheus</text>

  <!-- cross-namespace scrape -->
  <path d="M510,145 C570,145 570,145 608,145" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="560" y="130" font-size="11" text-anchor="middle" fill="#2e8b57">scrape /metrics</text>
  <text x="560" y="163" font-size="10" text-anchor="middle" fill="#2e8b57">every 15s</text>

  <!-- Admin -->
  <g>
    <circle cx="1115" cy="285" r="16" fill="#7d3c98"/>
    <circle cx="1115" cy="330" r="26" fill="#7d3c98"/>
    <rect x="1085" y="330" width="60" height="1" fill="none"/>
    <text x="1115" y="375" font-size="13" text-anchor="middle" fill="#333">You</text>
  </g>
  <line x1="1085" y1="290" x2="845" y2="280" stroke="#7d3c98" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="990" y="270" font-size="11" text-anchor="middle" fill="#7d3c98">view dashboard</text>
  <line x1="1085" y1="310" x2="845" y2="435" stroke="#7d3c98" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="990" y="400" font-size="11" text-anchor="middle" fill="#7d3c98">view alerts</text>
</svg>
