app:
  image:
    repository: ghcr.io/khangpham05/app-delivery-pipeline
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgres:
  image:
    repository: postgres
    tag: "16"
  user: app
  password: app
  database: app_delivery_pipeline
  service:
    port: 5432
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
